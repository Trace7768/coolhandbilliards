<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Player Portal · Coolhand Billiards</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/png" href="/players/CHB_Black_trans.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap">
<link rel="stylesheet" href="/assets/chb.css">
</head>
<body>
<main>
  <header class="top">
    <a class="home" href="/"><img src="/players/CHB_Black_trans.png" alt=""><span>Coolhand Billiards</span></a>
    <nav><a href="/schedules/">Schedules</a><a href="/players/" aria-current="page">Players</a></nav>
  </header>

  <div>
    <h1>Player Portal</h1>
    <p class="lede">Pick your team. You'll need your team PIN once on each device.</p>
  </div>

  <nav class="stack" id="teams" aria-label="Teams"><p class="status">Loading teams…</p></nav>

  <a class="card" href="/schedules/">
    <div><b>All schedules</b><span>Every active division, week by week</span></div>
    <i aria-hidden="true">→</i>
  </a>
</main>

<script src="/assets/league.js"></script>
<script>
(async () => {
  const { el } = CHB;
  const list = document.getElementById("teams");
  try {
    const [{ teams }, { divisions }] = await Promise.all([CHB.loadTeams(), CHB.loadSessions()]);
    list.replaceChildren(...teams.map((t) => {
      const div = divisions.find((d) => d.id === t.division);
      return el("a", { class: "card", href: `/players/${t.id}/` },
        el("div", {}, el("b", {}, t.name), el("span", {}, div ? `${div.night} · ${div.name}` : "Between sessions")),
        el("i", { "aria-hidden": "true" }, "→"));
    }));
  } catch (e) {
    list.replaceChildren(el("p", { class: "status" }, "Teams couldn't load. Try again in a minute."));
  }
})();
</script>
</body>
</html>
