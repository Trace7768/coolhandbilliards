# Each production deploy costs 15 of the free plan's 300 monthly credits, so
# skip deploys that visitors wouldn't notice.
[build]
  publish = "."
  # Exit 0 = skip this deploy. Skips when the only changes are data files or
  # photos (pages read those from GitHub directly), notes, or tooling.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)data/' ':(exclude)media/' ':(exclude)CLAUDE.md' ':(exclude)README.md' ':(exclude)tools/' ':(exclude).github/'"
