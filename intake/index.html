<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Player Intake · Coolhand Billiards</title>
<!-- Unlisted: shared directly with new players, never linked from the site. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/png" href="/players/CHB_Black_trans.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap">
<link rel="stylesheet" href="/assets/chb.css">
<style>
  form{display:flex;flex-direction:column;gap:32px}
  fieldset{border:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
  legend{padding:0 0 12px;margin-bottom:4px;width:100%;border-bottom:1px solid var(--border);font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .field{display:flex;flex-direction:column;gap:6px}
  .field>label,.group-label{font-size:15px;font-weight:400}
  .opt{color:var(--muted);font-weight:300;font-size:13px}
  .req{color:var(--muted)}
  input[type=text],input[type=tel],input[type=email],input[type=date],textarea{
    width:100%;min-height:48px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);
    color:var(--text);font:inherit;font-size:16px;border-radius:0;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--text)}
  input[type=date]{color-scheme:dark}
  .pair{display:grid;grid-template-columns:1fr;gap:16px}
  @media (min-width:520px){.pair{grid-template-columns:1fr 1fr}}

  .choices{display:flex;flex-wrap:wrap;gap:8px}
  .choice{position:relative;display:flex}
  .choice input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
  .choice span{display:flex;flex-direction:column;justify-content:center;min-height:48px;padding:8px 16px;border:1px solid var(--border-bright);font-size:15px;line-height:1.3}
  .choice small{color:var(--muted);font-size:12px}
  .choice input:checked+span{background:var(--text);color:var(--bg);border-color:var(--text)}
  .choice input:checked+span small{color:var(--bg)}
  .choice input:focus-visible+span{outline:2px solid var(--text);outline-offset:3px}
  .nights .choice{flex:1 1 140px}
  .nights .choice span{width:100%}

  .agree{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;font-size:15px}
  .agree input{width:22px;height:22px;margin:2px 0 0;accent-color:#fff}
  .agree b{font-weight:500}

  /* Spam trap: invisible to people, filled in by bots. */
  .trap{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}

  .err{color:var(--text);border-left:2px solid var(--text);padding-left:12px;font-size:15px;margin:0}
  .btn{width:100%}
  .btn[disabled]{opacity:.6;cursor:wait}
  .done{display:flex;flex-direction:column;gap:12px;padding:28px 20px;border:1px solid var(--text);background:var(--surface)}
  .done h2{margin:0;font-weight:500;font-size:24px}
  .done p{margin:0}
</style>
</head>
<body>
<main>
  <header class="top">
    <a class="home" href="/"><img src="/players/CHB_Black_trans.png" alt=""><span>Coolhand Billiards</span></a>
  </header>

  <div>
    <h1>Player intake</h1>
    <p class="lede">Fill this out to get on a roster. We'll be in touch with team and night details. Fields marked * are required.</p>
  </div>

  <div id="container">
    <form id="intake" novalidate>
      <fieldset>
        <legend>The basics</legend>
        <div class="pair">
          <div class="field"><label for="firstName">First name <span class="req">*</span></label><input type="text" id="firstName" required autocomplete="given-name"></div>
          <div class="field"><label for="lastName">Last name <span class="req">*</span></label><input type="text" id="lastName" required autocomplete="family-name"></div>
        </div>
        <div class="pair">
          <div class="field"><label for="phone">Phone <span class="req">*</span></label><input type="tel" id="phone" required inputmode="tel" placeholder="(502) 555-1234" autocomplete="tel"></div>
          <div class="field"><label for="email">Email <span class="opt">(optional)</span></label><input type="email" id="email" autocomplete="email"></div>
        </div>
        <div class="field"><label for="birthday">Birthday <span class="opt">(we'll get you a free-dues chip)</span></label><input type="date" id="birthday" autocomplete="bday"></div>
      </fieldset>

      <fieldset>
        <legend>Emergency contact</legend>
        <div class="pair">
          <div class="field"><label for="emergencyName">Name</label><input type="text" id="emergencyName"></div>
          <div class="field"><label for="emergencyPhone">Phone</label><input type="tel" id="emergencyPhone" inputmode="tel" placeholder="(502) 555-1234"></div>
        </div>
        <div class="field"><label for="emergencyRelation">Relationship <span class="opt">(spouse, parent, etc.)</span></label><input type="text" id="emergencyRelation"></div>
      </fieldset>

      <fieldset>
        <legend>League interest</legend>
        <div class="field" role="group" aria-labelledby="nights-label">
          <div class="group-label" id="nights-label">Which night(s) interest you? <span class="req">*</span></div>
          <div class="choices nights">
            <label class="choice"><input type="checkbox" name="nights" value="Monday"><span>Monday<small>Apex · Singles</small></span></label>
            <label class="choice"><input type="checkbox" name="nights" value="Tuesday"><span>Tuesday<small>Etown Metro · Teams</small></span></label>
            <label class="choice"><input type="checkbox" name="nights" value="Wednesday"><span>Wednesday<small>Bardstown · Teams</small></span></label>
          </div>
        </div>
        <div class="field"><label for="team">Existing team or captain referral <span class="opt">(if any)</span></label><input type="text" id="team" placeholder="Team name, or who recruited you"></div>
        <div class="field" role="radiogroup" aria-labelledby="size-label">
          <div class="group-label" id="size-label">Shirt size <span class="opt">(for league shirts and awards)</span></div>
          <div class="choices">
            <label class="choice"><input type="radio" name="size" value="S"><span>S</span></label>
            <label class="choice"><input type="radio" name="size" value="M"><span>M</span></label>
            <label class="choice"><input type="radio" name="size" value="L"><span>L</span></label>
            <label class="choice"><input type="radio" name="size" value="XL"><span>XL</span></label>
            <label class="choice"><input type="radio" name="size" value="2XL"><span>2XL</span></label>
            <label class="choice"><input type="radio" name="size" value="3XL"><span>3XL</span></label>
          </div>
        </div>
        <div class="field"><label for="notes">Anything else we should know? <span class="opt">(optional)</span></label><textarea id="notes" rows="3" placeholder="Schedule conflicts, prior NAPA experience, accessibility needs, etc."></textarea></div>
      </fieldset>

      <div class="trap" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" tabindex="-1" autocomplete="off"></div>

      <fieldset>
        <legend>Agreement</legend>
        <div class="agree">
          <input type="checkbox" id="waiver" required>
          <label for="waiver"><b>I agree to NAPA league rules.</b> By submitting this form, I acknowledge that I will follow the official NAPA rules and the local Coolhand Billiards league guidelines.</label>
        </div>
      </fieldset>

      <p class="err" id="err" role="alert" hidden></p>
      <button class="btn" type="submit" id="submit">Submit</button>
    </form>
  </div>
</main>

<script>
(() => {
  // EmailJS (coolhandbilliards@gmail.com account). These three values are
  // meant to be public; EmailJS ties them to the template's fixed recipient.
  const EMAILJS = {
    publicKey: "cke5JBR8U7twgkfMK",
    serviceId: "service_i24x2na",
    templateId: "template_ps96d8g",
  };
  const MIN_SECONDS = 4; // a person can't fill this out faster; bots do

  const form = document.getElementById("intake");
  const err = document.getElementById("err");
  const submit = document.getElementById("submit");
  const loadedAt = Date.now();
  const val = (id) => document.getElementById(id).value.trim();

  function formatPhone(v) {
    const d = v.replace(/\D/g, "").slice(0, 10);
    if (d.length < 4) return d.length ? "(" + d : "";
    if (d.length < 7) return `(${d.slice(0, 3)}) ${d.slice(3)}`;
    return `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}`;
  }
  for (const id of ["phone", "emergencyPhone"]) {
    document.getElementById(id).addEventListener("input", (e) => { e.target.value = formatPhone(e.target.value); });
  }

  function fail(msg, focusId) {
    err.textContent = msg;
    err.hidden = false;
    if (focusId) document.getElementById(focusId).focus();
  }

  function done() {
    document.getElementById("container").innerHTML =
      '<div class="done"><h2>You\'re in.</h2><p>Your intake was received. Brian will reach out within a few days with team and schedule details.</p></div>';
    window.scrollTo({ top: 0 });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.hidden = true;

    const nights = [...form.querySelectorAll('input[name="nights"]:checked')].map((n) => n.value);
    if (!val("firstName")) return fail("Please enter your first name.", "firstName");
    if (!val("lastName")) return fail("Please enter your last name.", "lastName");
    if (val("phone").replace(/\D/g, "").length < 10) return fail("Please enter a 10-digit phone number.", "phone");
    const email = val("email");
    if (email && !document.getElementById("email").checkValidity()) return fail("That email address doesn't look right.", "email");
    if (!nights.length) return fail("Please pick at least one league night.");
    if (!document.getElementById("waiver").checked) return fail("Please agree to the NAPA league rules to submit.", "waiver");

    // Spam traps: pretend it worked so bots move on, but send nothing.
    if (val("website") || (Date.now() - loadedAt) / 1000 < MIN_SECONDS) return done();

    const size = form.querySelector('input[name="size"]:checked');
    const params = {
      submitted_at: new Date().toLocaleString("en-US", { timeZone: "America/New_York" }) + " ET",
      first_name: val("firstName"),
      last_name: val("lastName"),
      formatted_name: `${val("lastName")}, ${val("firstName")}`,
      phone: val("phone"),
      email: email || "(not provided)",
      reply_to: email,
      birthday: val("birthday") || "(not provided)",
      emergency_name: val("emergencyName") || "(not provided)",
      emergency_phone: val("emergencyPhone") || "(not provided)",
      emergency_relation: val("emergencyRelation") || "(not provided)",
      nights: nights.join(", "),
      team: val("team") || "(not provided)",
      size: size ? size.value : "(not provided)",
      notes: val("notes") || "(none)",
      waiver_agreed: "Yes, agreed to NAPA league rules",
    };

    submit.disabled = true;
    submit.textContent = "Sending…";
    try {
      const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          service_id: EMAILJS.serviceId,
          template_id: EMAILJS.templateId,
          user_id: EMAILJS.publicKey,
          template_params: params,
        }),
      });
      if (!res.ok) throw new Error(await res.text());
      done();
    } catch (x) {
      submit.disabled = false;
      submit.textContent = "Submit";
      fail("Something went wrong sending your intake. Please try again in a minute, or message us on Facebook.");
    }
  });
})();
</script>
</body>
</html>
