# Pulls the latest NAPA schedules and scores into data/sessions.json and saves
# them to GitHub. Pages read that file from GitHub directly, so no Netlify
# deploy (and no credits) is needed. Only that file is ever changed.
name: Refresh schedules

on:
  schedule:
    # ~7:47 AM Kentucky time on Tue, Wed, Thu. GitHub schedules run in UTC, so
    # both 11:47 (summer, EDT) and 12:47 (winter, EST) are listed; the extra
    # run finds no changes and does nothing. An odd minute avoids GitHub's
    # top-of-the-hour delays.
    - cron: "47 11,12 * * 2,3,4"
  workflow_dispatch: # adds a "Run workflow" button on GitHub for a manual refresh

permissions:
  contents: write

concurrency:
  group: refresh-schedules

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read NAPA schedules
        run: python tools/napa_import.py --refresh

      - name: Publish if anything changed
        run: |
          if git diff --quiet -- data/sessions.json; then
            echo "Schedules unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sessions.json
          git commit -m "Refresh schedules from NAPA [skip netlify]"
          git pull --rebase
          git push
